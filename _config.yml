safe: true
encoding: UTF-8
url: https://roundcube.net
permalink: news/:year/:month/:day/:title
exclude: [vendor]
plugins: [jekyll-paginate]
paginate: 10
paginate_path: '/news/page:num/'
environment: 'production'
num_related_items: 5
exclude:
    - Gemfile
    - Gemfile.lock
    - jsdelivr.json
    - node_modules/
    - Makefile
    - package.json
    - package-lock.json
    - README.md
    - stylelint.config.mjs
